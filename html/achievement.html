<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Achievement</title>

    <link href="../index.html">
    <link rel="stylesheet" href="../CSS/components.css">
    <link rel="stylesheet" href="../CSS/achievement.css">

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/9a7cd84ca2.js" crossorigin="anonymous"></script>
</head>
<body class="subpage"> 
    

    <div class="gamelist">
        <!-- League of legends, Apex legends, Rainbow 6 -->

        <section id="games" class="games">
            <h2><center>My Game Achievement Corner</center></h2>

            <div class="game-actions">
                <div class="league">
                    <img class="gameicon" src="../Images/lol1.png" alt="lol">
                    <a class="btn" href="https://u.gg/lol/profile/sg2/%EC%86%8C%EC%A3%BC%CE%B9-uwu/overview" target="_blank"> U.gg </a>
                    <a class="btn" data-game="league">lol</a>
                </div>

                <div class="apex">
                    <img class="gameicon" src="../Images/apex1.png" alt="apex">
                    <a class="btn" data-game="apex">Apex Legends</a>
                </div>

                <div class="rainbow">
                    <img class="gameicon" src="../Images/rainbow6.png" alt="rainbow">
                    <a class="btn" data-game="rainbow">Rainbow Six Siege</a>
                </div>

            </div>
    </div>

            <div class="modal-overlay" id="modalOverlay">
                <div class="modal">
                    <button class="modal-close" id="modalClose">✕</button>
                    <div class="modal-content" id="modalContent">
                        <!-- content injected by JS --> 
                    </div>
                </div>
            </div>
           
    </div>

    <script src="../js/components.js"></script>
    <script src="../js/achievements.js"></script>
</body>
</html>
